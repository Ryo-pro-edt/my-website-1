<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Other works | Ryo</title>
    <style>
        :root { --text: #182235; --muted: #718096; --accent: #5271ff; --bg: #f4f7fb; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: var(--text); font-family: Arial, "Noto Sans JP", sans-serif; background: radial-gradient(circle at 10% 0%, #dce3ff, transparent 35%), var(--bg); }
        main { width: min(100%, 620px); padding: 42px; border: 1px solid #fff; border-radius: 24px; background: rgba(255, 255, 255, 0.86); box-shadow: 0 20px 55px rgba(55, 78, 120, 0.12); text-align: center; }
        h1 { margin: 0 0 12px; }
        p { margin: 0 0 26px; color: var(--muted); line-height: 1.8; }
        a { display: inline-block; padding: 10px 18px; border-radius: 999px; color: #fff; background: var(--accent); font-weight: 700; text-decoration: none; }
        a:hover, a:focus-visible { background: #3855d4; outline: none; }
    </style>
</head>
<body>
    <main>
        <h1>Other works</h1>
        <p>その他の HTML ページをここに追加できます。ページを追加したら、このページからリンクを増やしてください。</p>
        <a href="../index.html">プロフィールに戻る</a>
    </main>
</body>
</html>
