<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SC</title>
    <style>
        /* 全体のリセットと基本設定 */
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            color: #000000;
            /* あえてフォントをブラウザデフォルト（または明朝体）にしてレトロ感を演出 */
            font-family: "MS PMincho", "MS Mincho", "ヒラギノ明朝 Pro W3", serif;
            font-size: 16px;
            line-height: 1.4;
        }

        /* 画面を左右に分割するコンテナ（昔のフレーム構造をFlexboxで再現） */
        .container {
            display: flex;
            min-height: 100vh;
        }

        /* 左側：サイドナビゲーション */
        .sidebar {
            width: 200px;
            min-width: 150px;
            border-right: 2px solid #000000;
            padding: 15px;
            box-sizing: border-box;
            background-color: #ffffff;
        }

        .sidebar ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        .sidebar li {
            margin-bottom: 12px;
        }

        /* ネット黎明期の標準的な未訪問・訪問済みのリンクカラー */
        a {
            color: #0000ff;
            text-decoration: underline;
        }
        a:visited {
            color: #800080;
        }
        a:hover {
            color: #ff0000;
        }

        /* 右側：メインコンテンツ */
        .main-content {
            flex: 1;
            padding: 20px 30px;
            box-sizing: border-box;
        }

        /* タイトル部分 */
        h1 {
            font-size: 28px;
            font-weight: bold;
            margin-top: 0;
            margin-bottom: 20px;
        }

        /* プロフィール画像（実物はかなりサイズが最適化されています） */
        .profile-img {
            width: 250px;
            height: auto;
            border: 1px solid #000000;
            margin-bottom: 20px;
            display: block;
        }

        /* 区切り線 */
        hr {
            border: none;
            border-top: 1px solid #000000;
            margin: 20px 0;
        }

        h2 {
            font-size: 20px;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        /* お知らせなどのリスト */
        .info-list {
            padding-left: 20px;
            margin-bottom: 20px;
        }
        .info-list li {
            margin-bottom: 5px;
        }

        /* 古き良きシンプルなテーブル構造 */
        .profile-table {
            border-collapse: collapse;
            width: 100%;
            max-width: 500px;
            margin-bottom: 20px;
        }

        .profile-table th, .profile-table td {
            border: 1px solid #000000;
            padding: 6px 10px;
            text-align: left;
        }

        .profile-table th {
            background-color: #e6e6e6;
            width: 30%;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 左側メニュー -->
    <nav class="sidebar">
        <ul>
            <li><a href="#">トップ</a></li>
            <li><a href="#">Three.jsを使った作品</a></li>
        </ul>
    </nav>

    <!-- 右側メイン -->
    <main class="main-content">
        <h1>SC の ホームページ</h1>
        
        <!-- 画像プレースホルダー（実際の画像に差し替えてください） -->
        <img src="https://avatars.githubusercontent.com/u/188586823?s=400&u=024877f8ab0cbc08a61bb6c4650aa7b60b371992&v=4" alt="本人の写真" class="profile-img">
        
        <hr>
        
        <h2>最新情報</h2>
        <ul class="info-list">
            <li>Kaggle-Orbitwarsに参加中</li>
            <li></li>
        </ul>

        <hr>

        <h2>プロフィール</h2>
        <table class="profile-table">
            <tr>
                <th>生年月日</th>
                <td>????年11月17日</td>
            </tr>
            <tr>
                <th>血液型</th>
                <td>A型</td>
            </tr>
            <tr>
                <th>サイズ</th>
                <td>身長 ???cm</td>
            </tr>
            <tr>
                <th>趣味</th>
                <td>色々</td>
            </tr>
        </table>

        <hr>
        
        <p>Respect 阿部寛</p>
    </main>
</div>

</body>
</html>
