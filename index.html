<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SC - Atmospheric Glass</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* =========================================
           Design System: Atmospheric Glass
           ========================================= */
        :root {
            /* Colors */
            --primary: #ffffff;
            --on-surface: #dae2fd;
            --on-surface-variant: #c4c7c8;
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-border-subtle: rgba(255, 255, 255, 0.1);
            
            /* Spacing & Rounded */
            --spacing-unit: 8px;
            --rounded-md: 0.75rem;
            --rounded-lg: 1rem;
            --rounded-xl: 1.5rem;
        }

        /* 全体のリセットと背景設定 */
        body {
            margin: 0;
            padding: 24px;
            /* 鮮やかなマルチストップグラデーション（Deep Blue, Vivid Purple, Soft Pink） */
            background: linear-gradient(135deg, #1E3A8A 0%, #7E22CE 50%, #DB2777 100%);
            background-attachment: fixed;
            color: var(--primary);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            box-sizing: border-box;
            line-height: 1.5;
        }

        /* 浮遊感を持たせたレイアウト構造 */
        .container {
            display: flex;
            gap: 24px;
            max-width: 1200px;
            margin: 0 auto;
            flex-wrap: wrap; /* モバイル対応 */
        }

        /* Glassmorphism 共通ミックスイン (Level 2: Standard) */
        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-top: 1px solid rgba(255, 255, 255, 0.3); /* 光の屈折（インナーシャイン）をシミュレート */
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
            border-radius: var(--rounded-lg);
        }

        /* Glassmorphism 共通ミックスイン (Level 3: Elevated) */
        .glass-panel-elevated {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border);
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            border-left: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 12px 48px 0 rgba(0, 0, 0, 0.15);
            border-radius: var(--rounded-xl);
        }

        /* 左側：サイドナビゲーション */
        .sidebar {
            width: 250px;
            padding: 20px;
            flex-shrink: 0;
            height: fit-content;
        }

        .sidebar ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        .sidebar li {
            margin-bottom: 8px;
        }

        /* インタラクティブリストアイテム */
        .sidebar a {
            display: block;
            color: var(--primary);
            text-decoration: none;
            padding: 12px;
            border-radius: var(--rounded-md);
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
            text-shadow: 0px 2px 4px rgba(0,0,0,0.15);
        }

        .sidebar a:hover {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(4px);
        }

        /* 右側：メインコンテンツ */
        .main-content {
            flex: 1;
            padding: 40px;
            min-width: 300px;
        }

        /* タイポグラフィ */
        h1 {
            font-size: 32px;
            font-weight: 600;
            line-height: 40px;
            letter-spacing: -0.02em;
            margin-top: 0;
            margin-bottom: 24px;
            text-shadow: 0px 2px 4px rgba(0,0,0,0.15);
        }

        h2 {
            font-size: 24px;
            font-weight: 500;
            line-height: 32px;
            margin-top: 32px;
            margin-bottom: 16px;
            text-shadow: 0px 2px 4px rgba(0,0,0,0.15);
        }

        /* プロフィール画像 */
        .profile-img {
            width: 200px;
            height: auto;
            border-radius: var(--rounded-lg);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.15);
            margin-bottom: 24px;
            display: block;
        }

        /* 区切り線（すりガラスに合う繊細なライン） */
        hr {
            border: none;
            border-top: 1px solid var(--glass-border);
            margin: 32px 0;
        }

        /* リスト */
        .info-list {
            padding-left: 24px;
            color: var(--on-surface);
            font-size: 18px;
        }
        .info-list li {
            margin-bottom: 8px;
        }

        /* プロフィールテーブル（モダンなGlass仕様） */
        .profile-table {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
            max-width: 500px;
            border-radius: var(--rounded-md);
            overflow: hidden;
            border: 1px solid var(--glass-border-subtle);
            background: rgba(255, 255, 255, 0.05);
        }

        .profile-table th, .profile-table td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid var(--glass-border-subtle);
        }

        .profile-table tr:last-child th,
        .profile-table tr:last-child td {
            border-bottom: none;
        }

        .profile-table th {
            width: 30%;
            font-weight: 500;
            color: var(--primary);
            background: rgba(255, 255, 255, 0.08); /* わずかに目立たせる */
        }

        .profile-table td {
            color: var(--on-surface-variant);
            font-weight: 400;
        }

        /* label-sm typography */
        .respect-text {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: var(--on-surface-variant);
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="container">
    <nav class="sidebar glass-panel">
        <ul>
            <li><a href="#">トップ</a></li>
            <li><a href="threegames/3d_2048.html">Three.jsを使った作品</a></li>
        </ul>
    </nav>

    <main class="main-content glass-panel-elevated">
        <h1>SC の ホームページ</h1>
        
        <img src="https://avatars.githubusercontent.com/u/188586823?s=400&u=024877f8ab0cbc08a61bb6c4650aa7b60b371992&v=4" alt="本人の写真" class="profile-img">
        
        <hr>
        
        <h2>最新情報</h2>
        <ul class="info-list">
            <li>Kaggle-Orbitwarsに参加中</li>
        </ul>

        <hr>

        <h2>プロフィール</h2>
        <table class="profile-table">
            <tr>
                <th>生年月日</th>
                <td>????年11月17日</td>
            </tr>
            <tr>
                <th>血液型</th>
                <td>A型</td>
            </tr>
            <tr>
                <th>サイズ</th>
                <td>身長 ???cm</td>
            </tr>
            <tr>
                <th>趣味</th>
                <td>色々</td>
            </tr>
        </table>

        <hr>
        
        <p class="respect-text">Respect 阿部寛</p>
    </main>
</div>

</body>
</html>
